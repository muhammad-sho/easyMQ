services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Redis is intentionally NOT published to the host. Publish it only if
    # external tooling must reach it:
    # ports:
    #   - "127.0.0.1:6379:6379"

  easymq:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 3000
      # Set a real token in production (or run separate api/worker services).
      API_TOKEN: ${API_TOKEN:-changeme-in-production}
      APP_ROLE: both
      WORKER_CONCURRENCY: 10
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Example split deployment (uncomment to run dedicated roles):
  # easymq-api:
  #   build: .
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     REDIS_URL: redis://redis:6379
  #     API_TOKEN: ${API_TOKEN:-changeme-in-production}
  #     APP_ROLE: api
  #   ports:
  #     - "3000:3000"
  #   restart: unless-stopped
  #
  # easymq-worker:
  #   build: .
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     REDIS_URL: redis://redis:6379
  #     APP_ROLE: worker
  #     WORKER_CONCURRENCY: 20
  #   restart: unless-stopped

  # To use an externally managed Redis instead of the bundled one, remove
  # the `redis` service and set REDIS_URL to your instance, e.g.:
  #   REDIS_URL: redis://user:password@redis.example.com:6379/0

volumes:
  redis-data:
